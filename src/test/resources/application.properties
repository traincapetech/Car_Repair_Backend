spring.application.name=backend-test

# Dedicated Test Database Configuration (Configurable with environment variables, defaults to car_service_test)
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/car_service_test}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:car_service_user}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:Canada@1212}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:yc8t2YLPbW1HTwLWHoFG2mpaCbPGZsHsoU9uV079wnw=}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

server.port=0

password-reset.token-expiration=15

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173

# Razorpay Mock Configuration for Tests
razorpay.enabled=false
razorpay.key-id=
razorpay.key-secret=
razorpay.webhook-secret=
razorpay.mock-gateway=true

# Admin Provisioning
admin.default.enabled=true
admin.default.email=admin@carservice.com
admin.default.password=Admin@12345
admin.default.name=System Administrator
admin.default.phone=9999999999

# Service Catalog Seeding (Disabled for isolated tests)
service-catalog.seeding.enabled=false

# Workshop Seeding (Disabled for isolated tests)
workshop.seeding.enabled=false

